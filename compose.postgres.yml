services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: afs_test
      POSTGRES_USER: afs
      POSTGRES_PASSWORD: ${AFS_POSTGRES_PASSWORD:-afs-local-dev-only-change-me}
    ports:
      - "${AFS_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afs -d afs_test"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - afs_pg16_data:/var/lib/postgresql/data
volumes:
  afs_pg16_data:
